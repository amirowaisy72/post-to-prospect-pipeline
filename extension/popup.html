<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; margin: 0; padding: 14px; font-family: "Segoe UI", sans-serif; }
  h1 { font-size: 15px; margin: 0 0 4px; text-align: center; }
  p.sub { font-size: 11px; color: #555; margin: 0 0 10px; text-align: center; }
  #status { text-align: center; font-size: 12px; color: gray; margin-bottom: 6px; }
  #count { text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 10px; }
  button { display: block; width: 100%; padding: 9px; margin: 6px 0;
           font-size: 13px; font-weight: bold; border: none; border-radius: 6px;
           cursor: pointer; }
  #startBtn { background: #2e7d32; color: #fff; }
  #stopBtn { background: #b71c1c; color: #fff; }
  #dlBtn { background: #1565c0; color: #fff; }
  #clearBtn { background: #eee; color: #333; }
  button:disabled { opacity: 0.45; cursor: default; }
  #note { font-size: 11px; color: #777; margin-top: 8px; text-align: center; }
</style>
</head>
<body>
  <h1>Raw Data Collector</h1>
  <p class="sub">Browse manually — new text is saved automatically.</p>
  <div id="status">—</div>
  <div id="count">Captured: 0</div>
  <button id="startBtn">▶ Start</button>
  <button id="stopBtn" disabled>■ Stop &amp; download .txt</button>
  <button id="dlBtn">⬇ Download .txt</button>
  <button id="clearBtn">Clear saved data</button>
  <div id="note">Start → draw a rectangle on the page (Esc = whole page).<br>
  If Start does nothing, reload the page and try again.</div>
  <script src="popup.js"></script>
</body>
</html>
